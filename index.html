    <!-- Theme color untuk browser bar -->
    <meta name="theme-color" content="#faf8f5" />
    <script>
      // Early theme detection to avoid flash of light mode
      try {
        var savedTheme = localStorage.getItem('tmf2_theme') || localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) metaThemeColor.setAttribute('content', '#0f172a');
        }
      } catch (e) {}

      // Capture beforeinstallprompt as early as possible
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('[Global] beforeinstallprompt event fired and captured.');
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('tmf2_beforeinstallprompt', { detail: e }));
      });
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then(reg => {
              console.log('Service Worker registered successfully:', reg.scope);
            })
            .catch(err => console.warn('Service Worker registration failed:', err));
        });
      }
    </script>
